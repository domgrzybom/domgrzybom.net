<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>dōm̄﻿.m̄﻿uzykom̄﻿</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../favicon.ico">

<style>
:root { --base-font-size: 18px; }

@font-face {
  font-family: "AcPlus_IBM_VGA";
  src: url('../AcPlus_IBM_VGA_8x16.ttf') format("truetype");
}

body, button, strong, h1, input {
  font-family: "AcPlus_IBM_VGA", monospace;
  font-size: var(--base-font-size);
  margin: 0;
}

body {
  background-color: #000;
  color: #ffe09c;
  background-image: url('../animacja.gif');
  background-repeat: no-repeat;
  background-position: calc(100% - 150px) 320px;
  background-size: 300px 300px;
  image-rendering: pixelated;
}

.content { padding: 20px; padding-left: 40px; }

/* MONITOR */
.monitor-wrapper {
  position: relative;
  width: 440px;
  margin-bottom: 10px;
  cursor: pointer;
}

.monitor-img {
  width: 100%;
  display: block;
  image-rendering: pixelated;
}

.monitor-screen {
  position: absolute;
  top: 21px;
  left: 27px;
  width: 386px;
  height: 309px;
  background: transparent;
  overflow: hidden;
  display: none;
}

.monitor-screen img,
.monitor-screen video {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

/* BANER */
.banner-top {
  width: 100%;
  text-align: center;
  margin-top: 10px;
}

.banner-top img {
  width: 384px;
  height: 192px;
  image-rendering: pixelated;
}

/* PRZYCISK */
.home-button {
  padding: 2px 6px;
  background: #ffe09c;
  color: black;
  border: 2px solid #fff;
  border-right-color: #404040;
  border-bottom-color: #404040;
  cursor: pointer;
  margin-bottom: 20px;
}

.home-button:active {
  border: 2px solid #404040;
  border-right-color: #fff;
  border-bottom-color: #fff;
}

.home-button-wrapper { text-align: center; }

/* BUTTONY */
button {
  padding: 2px 8px;
  background: #ffe09c;
  color: black;
  border: 2px solid #fff;
  border-right-color: #404040;
  border-bottom-color: #404040;
  cursor: pointer;
}

button:active {
  border: 2px solid #404040;
  border-right-color: #fff;
  border-bottom-color: #fff;
}

/* PLAYER */
.player {
  width: 420px;
  border: 2px solid #ffe09c;
  padding: 10px;
  margin-bottom: 20px;
}

#track-name { margin-bottom: 10px; color: #80ff80; }

.controls { margin-bottom: 10px; }

/* PROGRESS */
.progress-container {
  display: flex;
  height: 20px;
  border: 2px solid #808080;
  cursor: pointer;
  margin-bottom: 5px;
}

.progress-segment { height: 100%; flex-shrink: 0; }

#progress-time {
  color: #ffe09c;
  font-size: 0.9em;
  margin-bottom: 10px;
}

/* VOLUME */
.volume-container {
  display: flex;
  align-items: center;
  margin-top: 10px;
}

.volume-container input[type="range"] {
  -webkit-appearance: none;
  width: 150px;
  height: 12px;
  background: #000;
  border: 2px solid #ffe09c;
  outline: none;
  margin-right: 5px;
}

.volume-container input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 12px;
  height: 12px;
  background: #ffe09c;
  border: 2px solid #fff;
  border-right-color: #404040;
  border-bottom-color: #404040;
}

.volume-container input[type="range"]::-moz-range-thumb {
  width: 12px;
  height: 12px;
  background: #ffe09c;
  border: 2px solid #fff;
  border-right-color: #404040;
  border-bottom-color: #404040;
}

/* LISTA */
.song {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 400px;
  border: 2px solid #ffe09c;
  padding: 10px;
  margin-bottom: 10px;
}
</style>
</head>

<body>

<div class="banner-top">
  <img src="../dgnBanerN.jpg">
</div>

<div class="content">

<div class="home-button-wrapper">
  <button class="home-button" onclick="location.href='../'">
    zaznanie aktu powrotu do przedpokoju dōmugrzybōmu
  </button>
</div>

<!-- MONITOR -->
<div class="monitor-wrapper" onclick="toggleScreen()">
  <img id="monitor-img" src="monitor_off.png" class="monitor-img">

  <div class="monitor-screen" id="monitor-screen">
    <img id="screen-image" style="display:none;">
    <video id="screen-video" loop muted style="display:none;"></video>
  </div>
</div>

<h1 style="color:#80ff80;">odtworzyciel plików mp3</h1>

<div class="player">
  <div id="track-name">zapodaj nośnik z utworem na odtwarzacz</div>

  <div class="controls">
    <button onclick="play()">graj</button>
    <button onclick="pause()">pauza</button>
    <button onclick="stop()">zeruj</button>
    <button onclick="download()">ściągnij mp3 ZA DARMOCHĘ</button>
  </div>

  <div class="progress-container" id="progress-container" onclick="seek(event)"></div>
  <div id="progress-time">0:00 / 0:00</div>

  <div class="volume-container">
    <span style="margin-right:5px;">głośność</span>
    <input type="range" min="0" max="1" step="0.01" value="1" onchange="setVolume(this.value)">
    <span id="volume-value">100%</span>
  </div>
</div>

<div id="song-list"></div>

</div>

<script>
const audio = new Audio()
let currentFile = ""
let screenOn = false

function play(){
  audio.play()

  if(screenOn){
    loadVisual(currentFile.replace("pliki_mp3/",""))
  }
}

function pause(){ audio.pause() }

function stop(){
  audio.pause()
  audio.currentTime = 0
}

function setVolume(v){
  audio.volume = v
  document.getElementById("volume-value").innerText = Math.round(v*100)+"%"
}

function download(){
  if(!currentFile) return
  const a=document.createElement("a")
  a.href=currentFile
  a.download=""
  a.click()
}

function updateProgress(){
  const container=document.getElementById("progress-container")
  container.innerHTML=""

  if(audio.duration){
    const total=50
    const gap=2
    const w=(container.clientWidth-gap*(total-1))/total

    for(let i=0;i<total;i++){
      const seg=document.createElement("div")
      seg.className="progress-segment"
      seg.style.width=w+"px"
      seg.style.marginRight=(i<total-1?gap+"px":"0")

      seg.style.background = i < Math.round(total*(audio.currentTime/audio.duration))
        ? "#ffe09c"
        : "#000"

      container.appendChild(seg)
    }
  }

  const cm=Math.floor(audio.currentTime/60)
  const cs=Math.floor(audio.currentTime%60).toString().padStart(2,'0')
  const dm=Math.floor(audio.duration/60)||0
  const ds=Math.floor(audio.duration%60).toString().padStart(2,'0')

  document.getElementById("progress-time").innerText=`${cm}:${cs} / ${dm}:${ds}`
}

audio.ontimeupdate=updateProgress

function seek(e){
  const rect=e.currentTarget.getBoundingClientRect()
  const percent=(e.clientX-rect.left)/rect.width
  audio.currentTime=percent*audio.duration
}

/* AUTO VISUAL */
function loadVisual(name){
  const img = document.getElementById("screen-image")
  const vid = document.getElementById("screen-video")

  img.style.display = "none"
  vid.style.display = "none"

  const base = name.replace(".mp3","")
  const exts = [".jpg", ".gif", ".png", ".mp4"]

  let i = 0

  function tryNext(){
    if(i >= exts.length){
      img.src = "visuals/default.jpg"
      img.style.display = "block"
      return
    }

    const path = "visuals/" + base + exts[i]
    i++

    if(path.endsWith(".mp4")){
      // video sprawdzamy “na żywo”
      vid.onloadeddata = () => {
        vid.style.display = "block"
        vid.play()
      }
      vid.onerror = tryNext
      vid.src = path
      return
    }

    const testImg = new Image()

    testImg.onload = () => {
      img.src = path
      img.style.display = "block"
    }

    testImg.onerror = tryNext

    testImg.src = path
  }

  tryNext()
}

/* MONITOR POWER */
function toggleScreen(){
  const screen=document.getElementById("monitor-screen")
  const monitor=document.getElementById("monitor-img")

  screenOn=!screenOn

  if(screenOn){
    screen.style.display="block"
    monitor.src="monitor_on.png"

    if(currentFile){
      loadVisual(currentFile.replace("pliki_mp3/",""))
    }

  } else {
    screen.style.display="none"
    monitor.src="monitor_off.png"

    document.getElementById("screen-image").src=""
    document.getElementById("screen-video").src=""
  }
}

function loadTrack(file){
  currentFile=file
  audio.src=file

  const name=file.replace("pliki_mp3/","")
  document.getElementById("track-name").innerText=name

  audio.play()

  // TYLKO jeśli monitor włączony
  if(screenOn){
    loadVisual(name)
  }
}

fetch("lista.json")
.then(r=>r.json())
.then(files=>{
  files.reverse()
  const list=document.getElementById("song-list")

  files.forEach(file=>{
    const div=document.createElement("div")
    div.className="song"
    div.innerHTML=`<strong>${file}</strong>
<button onclick="loadTrack('pliki_mp3/${file}')">odtwórz</button>`
    list.appendChild(div)
  })
})
</script>

</body>
</html>
